# This file was auto-generated by the Firebase CLI
# Modified for Dev branch previews

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - Main  # live branch
      - Dev   # dev branch for preview

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 20

      # Install dependencies and build React app
      - name: Install and build
        working-directory: my-react-app
        run: npm ci && npm run build

      # Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVOPS_ESCAPEROOM }}
          projectId: devops-escaperoom
          channelId: ${{ github.ref == 'refs/heads/Main' && 'live' || github.ref_name }}
